services:
  capture:
    build: ./capture
    container_name: madaleno-bot
    restart: unless-stopped
    env_file: .env
    environment:
      - DATA_DIR=/data
      - CAPTURE_PORT=3000
      # Importante para "hora más activa", los avisos diarios y las fechas
      # del calendario: Node usa TZ automáticamente (sin que ningún código
      # la lea explícitamente) para interpretar fechas y horas. Sin esto,
      # el contenedor corre en UTC y todo se calcula desplazado respecto a
      # tu hora real.
      - TZ=${TZ:-Europe/Madrid}
    volumes:
      # Sesión de WhatsApp + base de datos (persistente)
      - ./data:/data
      # --- CSV como montajes de FICHERO ---
      # Declararlos por separado hace que Coolify los muestre en
      # Storages > File mount, donde puedes editar su contenido desde
      # la web y guardar, sin entrar por SSH.
      - ./data/docs/conocimiento.csv:/data/docs/conocimiento.csv
      - ./data/docs/cumples.csv:/data/docs/cumples.csv
      - ./data/docs/efemerides.csv:/data/docs/efemerides.csv
    ports:
      # API interna: solo desde el propio servidor.
      - "127.0.0.1:3000:3000"
      # Web del calendario: en Coolify se publica con un dominio propio
      # (Configuration → Domains → https://cal.tudominio.com:3001).
      - "127.0.0.1:3001:3001"
    # Chromium (Puppeteer) necesita memoria compartida
    shm_size: "1gb"
